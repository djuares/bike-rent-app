[workspace]
resolver = "2"
members = [
    "common",
    "station",
    "user_app",
    "payment_gateway",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Grupo TP Concurrentes"]
rust-version = "1.75"

[workspace.dependencies]
actix = "0.13"
common = { path = "common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
uuid = { version = "=1.8.0", features = ["v4"] }
