services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1001}
    image: tp-concu-dev:latest
    container_name: tp-concu-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace:rw
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    environment:
      - CARGO_TERM_COLOR=always
      - RUST_BACKTRACE=1
    stdin_open: true
    tty: true
    command: /bin/bash
    networks:
      - tp-concu-net

networks:
  tp-concu-net:
    driver: bridge

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
